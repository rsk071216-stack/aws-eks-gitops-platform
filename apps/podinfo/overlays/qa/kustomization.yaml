apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# QA tracks a release *tag*. Every change lands here first; once the QA smoke
# tests pass, the promote workflow resolves the tag to its immutable digest and
# opens a PR that pins prod to that exact digest.
namespace: podinfo-qa

resources:
  - ../../base

labels:
  - pairs:
      app.kubernetes.io/environment: qa

replicas:
  - name: podinfo
    count: 1

images:
  - name: ghcr.io/stefanprodan/podinfo
    newTag: 6.15.0

patches:
  - target:
      kind: Deployment
      name: podinfo
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "#c27c0e"
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "qa - tracks release tags"
