apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Environment-agnostic, hardened baseline for podinfo.
# Overlays (qa, prod) set the namespace, image reference and sizing.
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml

labels:
  - pairs:
      app.kubernetes.io/name: podinfo
      app.kubernetes.io/part-of: aws-eks-gitops-platform
    includeSelectors: true

images:
  - name: ghcr.io/stefanprodan/podinfo
    newTag: 6.14.1
