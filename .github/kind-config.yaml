# kind cluster used by CI: one control plane + two workers in two fake
# "zones", so topologySpreadConstraints in the prod overlay are exercised.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-a
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-b
