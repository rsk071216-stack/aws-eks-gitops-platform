version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Let new releases bake for a week before proposing them.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: terraform
    directories:
      - /terraform
      - /terraform/bootstrap
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      terraform:
        patterns: ["*"]
    commit-message:
      prefix: "terraform"
